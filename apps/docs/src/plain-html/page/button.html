<!doctype html>
<html lang="en" data-product="cv" data-density="comfortable">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buttons from CSS alone</title>
    <link rel="stylesheet" href="../css/index.css">
  </head>
  <body>
    <main id="top">
      <h1>Buttons from CSS alone</h1>
      <p>This page loads only the @zigordev/css bundle. It runs no JavaScript.</p>
      <p>
        <button class="ds-button" type="button">Save changes</button>
        <button class="ds-button" data-variant="soft" type="button">Preview</button>
        <button class="ds-button" data-variant="outline" data-tone="neutral" type="button">Cancel</button>
        <button class="ds-button" data-variant="ghost" data-tone="neutral" type="button">Skip</button>
        <button class="ds-button" data-tone="danger" type="button">Delete</button>
        <button class="ds-button" type="button" disabled>Publish</button>
        <a class="ds-button" data-variant="outline" href="#top">Back to top</a>
      </p>
    </main>
  </body>
</html>
