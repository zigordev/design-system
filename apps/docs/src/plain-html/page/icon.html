<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Icons from the sprite</title>
    <link rel="stylesheet" href="../css/index.css">
  </head>
  <body>
    <main>
      <h1>Icons from the sprite</h1>
      <p>
        <svg class="ds-icon" id="sun" data-size="md" aria-hidden="true"><use href="../icons/sprite.svg#sun"></use></svg>
        <svg class="ds-icon" data-size="sm" aria-hidden="true"><use href="../icons/sprite.svg#moon"></use></svg>
        <svg class="ds-icon" data-size="lg" role="img" aria-label="Search"><use href="../icons/sprite.svg#search"></use></svg>
      </p>
      <p>
        <button class="ds-button" type="button">
          <span class="ds-button__icon" aria-hidden="true"><svg class="ds-icon" id="plus" aria-hidden="true"><use href="../icons/sprite.svg#plus"></use></svg></span>
          Add match
        </button>
      </p>
    </main>
  </body>
</html>
