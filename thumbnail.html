<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0}body{width:1280px;height:854px;display:flex;font-family:var(--ds-font-sans);}
.main{flex:0 0 75%;background:var(--ds-color-accent);display:flex;align-items:center;justify-content:center;padding:0 60px;box-sizing:border-box;}
.name{color:#fff;font-weight:800;letter-spacing:-0.01em;font-size:52px;line-height:1.05;text-align:center;white-space:nowrap;}
.strip{flex:1;display:flex;flex-direction:column;}
.strip div{flex:1;}
</style></head>
<body>
<div class="main"><div class="name">Shared Product Design System</div></div>
<div class="strip">
<div style="background:var(--ds-color-accent-soft)"></div>
<div style="background:var(--ds-color-success)"></div>
<div style="background:var(--ds-color-accent)"></div>
<div style="background:var(--ds-color-accent-hover)"></div>
</div>
</body></html>
