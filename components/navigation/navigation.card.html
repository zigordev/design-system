<!-- @dsCard group="Components" viewport="700x260" name="Navigation / Tabs, Sidebar" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--ds-color-bg);font-family:var(--ds-font-sans);color:var(--ds-color-fg);}
  .tabs{display:inline-flex;gap:2px;padding:4px;border-radius:var(--ds-radius-full);background:var(--ds-color-surface-2);border:1px solid var(--ds-color-border);margin-bottom:20px;}
  .tab{border:0;background:transparent;padding:7px 16px;border-radius:var(--ds-radius-full);font-size:var(--ds-text-sm);font-weight:600;color:var(--ds-color-fg-muted);}
  .tab.active{background:var(--ds-color-surface);color:var(--ds-color-accent);box-shadow:var(--ds-shadow-sm);}
  .sidebar{width:200px;border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-lg);background:var(--ds-color-surface);overflow:hidden;}
  .sb-head{padding:12px 16px;border-bottom:1px solid var(--ds-color-border);font-weight:800;}
  .sb-nav{padding:10px;display:grid;gap:4px;}
  .sb-link{padding:9px 12px;border-radius:var(--ds-radius-md);font-size:var(--ds-text-sm);font-weight:600;color:var(--ds-color-fg-muted);text-decoration:none;}
  .sb-link.active{background:var(--ds-color-accent-soft);color:var(--ds-color-accent);}
</style>
</head>
<body>
  <div class="tabs">
    <button class="tab active">Overview</button>
    <button class="tab">Players</button>
    <button class="tab">Rules</button>
  </div>
  <div class="sidebar">
    <div class="sb-head">Brand</div>
    <div class="sb-nav">
      <a class="sb-link active" href="#">Pools</a>
      <a class="sb-link" href="#">Stats</a>
      <a class="sb-link" href="#">Teams</a>
      <a class="sb-link" href="#">Profile</a>
    </div>
  </div>
</body>
</html>
