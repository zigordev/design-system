<!-- @dsCard group="Components" viewport="700x360" name="Forms / Input, Select, Checkbox, Switch" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--ds-color-bg);font-family:var(--ds-font-sans);color:var(--ds-color-fg);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  label.lbl{display:block;font-size:var(--ds-text-sm);font-weight:var(--ds-weight-semibold);margin-bottom:6px;}
  .hint{font-size:var(--ds-text-xs);color:var(--ds-color-fg-subtle);margin-top:6px;display:block;}
  .err{font-size:var(--ds-text-xs);color:var(--ds-color-danger);margin-top:6px;display:block;}
  .input{box-sizing:border-box;width:100%;height:38px;padding:0 12px;background:var(--ds-color-surface);border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-md);font-size:var(--ds-text-base);color:var(--ds-color-fg);}
  .input.invalid{border-color:var(--ds-color-danger);}
  .input.foc{border-color:var(--ds-color-accent);box-shadow:0 0 0 3px var(--ds-color-accent-soft);}
  .select-wrap{position:relative;}
  .select{appearance:none;box-sizing:border-box;width:100%;height:38px;padding:0 34px 0 12px;background:var(--ds-color-surface);border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-md);font-size:var(--ds-text-base);color:var(--ds-color-fg);}
  .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ds-color-fg-subtle);font-size:11px;}
  .row{display:flex;align-items:center;gap:20px;margin-top:6px;}
  .cb-row{display:inline-flex;align-items:center;gap:8px;font-size:var(--ds-text-sm);}
  .cb{width:18px;height:18px;accent-color:var(--ds-color-accent);}
  .switch{position:relative;display:inline-flex;width:38px;height:22px;border-radius:999px;background:var(--ds-color-border-strong);}
  .switch.on{background:var(--ds-color-accent);}
  .thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--ds-shadow-sm);}
  .switch.on .thumb{transform:translateX(16px);}
</style>
</head>
<body>
  <div class="grid">
    <div>
      <label class="lbl">Team name *</label>
      <input class="input foc" value="The Underdogs">
      <span class="hint">Visible to other players</span>
    </div>
    <div>
      <label class="lbl">Email</label>
      <input class="input invalid" value="not-an-email">
      <span class="err">Enter a valid email address</span>
    </div>
    <div>
      <label class="lbl">Division</label>
      <div class="select-wrap">
        <select class="select"><option>Premier League</option></select>
        <span class="chev">▾</span>
      </div>
    </div>
    <div>
      <label class="lbl">Options</label>
      <div class="row">
        <label class="cb-row"><input class="cb" type="checkbox" checked> Notify me by email</label>
      </div>
      <div class="row">
        <span class="cb-row">Dark mode</span>
        <span class="switch on"><span class="thumb"></span></span>
        <span class="switch"><span class="thumb"></span></span>
      </div>
    </div>
  </div>
</body>
</html>
