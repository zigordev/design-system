<!-- @dsCard group="Components" viewport="700x230" name="Core / Button" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--ds-color-bg);font-family:var(--ds-font-sans);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--ds-radius-md);font-weight:var(--ds-weight-semibold);font-size:var(--ds-text-sm);height:38px;padding:0 16px;cursor:pointer;}
  .primary{background:var(--ds-color-accent);color:var(--ds-color-accent-fg);box-shadow:var(--ds-shadow-xs);}
  .secondary{background:var(--ds-color-surface-2);color:var(--ds-color-fg);border-color:var(--ds-color-border);}
  .outline{background:var(--ds-color-surface);color:var(--ds-color-fg);border-color:var(--ds-color-border);}
  .ghost{background:transparent;color:var(--ds-color-fg-muted);}
  .danger{background:var(--ds-color-danger);color:var(--ds-color-accent-fg);}
  .sm{height:32px;padding:0 12px;font-size:var(--ds-text-xs);}
  .lg{height:46px;padding:0 22px;font-size:var(--ds-text-base);}
  .icon{width:38px;height:38px;padding:0;}
  .disabled{opacity:.55;cursor:not-allowed;}
</style>
</head>
<body>
  <div class="row">
    <button class="btn primary">Primary</button>
    <button class="btn secondary">Secondary</button>
    <button class="btn outline">Outline</button>
    <button class="btn ghost">Ghost</button>
    <button class="btn danger">Danger</button>
  </div>
  <div class="row">
    <button class="btn primary sm">Small</button>
    <button class="btn primary">Medium</button>
    <button class="btn primary lg">Large</button>
    <button class="btn primary icon">＋</button>
    <button class="btn primary disabled">Disabled</button>
  </div>
</body>
</html>
