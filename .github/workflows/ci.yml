name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repo
    uses: zigordev/toolkit/.github/workflows/repo-checks.yml@06f81d27c38f31c78b4bc963808d41ac0062b178 # workflows-v0.2.0
    permissions:
      contents: read
      pull-requests: read

  node:
    name: Node
    uses: zigordev/toolkit/.github/workflows/node-ci.yml@06f81d27c38f31c78b4bc963808d41ac0062b178 # workflows-v0.2.0
    permissions:
      contents: read
      packages: read
    with:
      playwright-browsers: chromium firefox webkit
