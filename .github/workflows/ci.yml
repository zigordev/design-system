name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repo
    uses: zigordev/toolkit/.github/workflows/repo-checks.yml@016be28b63906e638bc99c8f40107c93337202d8 # workflows-v0.1.0
    permissions:
      contents: read
      pull-requests: read

  node:
    name: Node
    uses: zigordev/toolkit/.github/workflows/node-ci.yml@016be28b63906e638bc99c8f40107c93337202d8 # workflows-v0.1.0
    permissions:
      contents: read
      packages: read
    with:
      playwright-browsers: chromium firefox webkit
