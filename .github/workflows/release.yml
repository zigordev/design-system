name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: zigordev/toolkit/.github/workflows/release-please.yml@06f81d27c38f31c78b4bc963808d41ac0062b178 # workflows-v0.2.0
    permissions:
      contents: write
      issues: write
      pull-requests: write

  publish:
    name: Publish
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    uses: zigordev/toolkit/.github/workflows/publish-npm.yml@06f81d27c38f31c78b4bc963808d41ac0062b178 # workflows-v0.2.0
    permissions:
      contents: read
      packages: write
    with:
      paths: ${{ needs.release.outputs.paths_released }}
