name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    uses: zigordev/toolkit/.github/workflows/commit-messages.yml@06f81d27c38f31c78b4bc963808d41ac0062b178 # workflows-v0.2.0
    permissions:
      contents: read
      packages: read
