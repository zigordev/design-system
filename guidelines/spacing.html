<!-- @dsCard group="Spacing" viewport="700x220" subtitle="4px base scale used for gap/padding across components" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--ds-color-bg);font-family:var(--ds-font-mono);color:var(--ds-color-fg);font-size:11px;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar{height:14px;background:var(--ds-color-accent);border-radius:3px;}
</style></head>
<body>
  <div class="row"><span style="width:70px">space-1</span><div class="bar" style="width:var(--ds-space-1)"></div></div>
  <div class="row"><span style="width:70px">space-2</span><div class="bar" style="width:var(--ds-space-2)"></div></div>
  <div class="row"><span style="width:70px">space-3</span><div class="bar" style="width:var(--ds-space-3)"></div></div>
  <div class="row"><span style="width:70px">space-4</span><div class="bar" style="width:var(--ds-space-4)"></div></div>
  <div class="row"><span style="width:70px">space-6</span><div class="bar" style="width:var(--ds-space-6)"></div></div>
  <div class="row"><span style="width:70px">space-8</span><div class="bar" style="width:var(--ds-space-8)"></div></div>
  <div class="row"><span style="width:70px">space-12</span><div class="bar" style="width:var(--ds-space-12)"></div></div>
  <div class="row"><span style="width:70px">space-16</span><div class="bar" style="width:var(--ds-space-16)"></div></div>
</body></html>
