<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--ds-color-bg);font-family:var(--ds-font-sans);color:var(--ds-color-fg);}
h1,h2,h3{margin:0 0 8px;letter-spacing:var(--ds-tracking-tight);line-height:var(--ds-leading-tight);font-weight:var(--ds-weight-bold);}
</style></head>
<body>
<h1 style="font-size:var(--ds-text-3xl)">Display 3xl — 36px</h1>
<h2 style="font-size:var(--ds-text-2xl)">Display 2xl — 28px</h2>
<h3 style="font-size:var(--ds-text-xl)">Display xl — 22px</h3>
<p style="font-size:var(--ds-text-lg);font-weight:var(--ds-weight-semibold);margin:0">Heading lg — 18px</p>
</body></html>
