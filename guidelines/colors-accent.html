<!-- @dsCard group="Colors" viewport="700x140" subtitle="Accent — used for primary actions, links, focus rings" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--ds-color-bg);font-family:var(--ds-font-sans);}
  .row{display:flex;gap:12px;}
  .sw{flex:1;height:80px;border-radius:var(--ds-radius-md);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-family:var(--ds-font-mono);color:inherit;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--ds-color-accent);color:var(--ds-color-accent-fg)">accent</div>
  <div class="sw" style="background:var(--ds-color-accent-hover);color:var(--ds-color-accent-fg)">accent-hover</div>
  <div class="sw" style="background:var(--ds-color-accent-soft);color:var(--ds-color-accent)">accent-soft</div>
  <div class="sw" style="background:var(--ds-color-accent-fg);color:var(--ds-color-accent);border:1px solid var(--ds-color-border)">accent-fg</div>
</div>
</body></html>
