<!-- @dsCard group="Type" viewport="700x200" subtitle="Body copy + tabular mono for numeric data" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--ds-color-bg);font-family:var(--ds-font-sans);color:var(--ds-color-fg);}
p{margin:0 0 8px;}
</style></head>
<body>
<p style="font-size:var(--ds-text-base)">Base body text (15px) — for descriptions, form labels, and table cells.</p>
<p style="font-size:var(--ds-text-sm);color:var(--ds-color-fg-muted)">Small text (13px), muted — secondary metadata, captions.</p>
<p style="font-size:var(--ds-text-xs);color:var(--ds-color-fg-subtle);text-transform:uppercase;letter-spacing:var(--ds-tracking-wide);font-weight:700">Eyebrow / label (12px uppercase)</p>
<p style="font-family:var(--ds-font-mono);font-size:var(--ds-text-base);font-variant-numeric:tabular-nums">$128,400.50 · +12.4%</p>
</body></html>
